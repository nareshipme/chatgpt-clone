# Local stack: Postgres, Redis, the API and the web app (Nginx serving the React build and proxying /api).
#
#   docker compose up --build        then open http://localhost:3000
#
# Works with no configuration: the assistant answers with the built-in mock provider. To use a real model, copy
# .env.example to .env and set LLM_PROVIDER=openai_compatible and LLM_API_KEY (compose reads .env automatically).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://chat:chat@db:5432/chat
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      PORT: "8000"
      # Local development defaults. Production sets real values (see README: Deploy).
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-do-not-use-in-production-0123456789abcdef}
      COOKIE_SECURE: "false" # the refresh cookie must work over plain http://localhost
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_MODEL: ${LLM_MODEL:-poolside/laguna-s-2.1:free}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      PORT: "8080"
      API_UPSTREAM: http://api:8000
    ports:
      - "3000:8080"
    depends_on:
      - api

volumes:
  pgdata:
